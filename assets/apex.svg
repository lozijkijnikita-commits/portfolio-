<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Абстрактная 3D-схема разбора клавиатуры">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3444"/>
      <stop offset="1" stop-color="#151b25"/>
    </linearGradient>
    <linearGradient id="plate2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4658"/>
      <stop offset="1" stop-color="#1b2330"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b82"/>
      <stop offset="1" stop-color="#2b3544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7ff4f"/>
      <stop offset="1" stop-color="#7fe0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <ellipse cx="610" cy="380" rx="430" ry="210" fill="#d7ff4f" opacity=".10" filter="url(#glow)"/>

  <!-- верхний слой: плата с клавишами -->
  <g transform="translate(600 300) rotate(-8) skewX(-14)" stroke="#0b0f14" stroke-width="2">
    <rect x="-330" y="-120" width="660" height="240" rx="26" fill="url(#plate2)"/>
    <g fill="url(#key)">
      <rect x="-300" y="-92" width="64" height="54" rx="10"/>
      <rect x="-226" y="-92" width="64" height="54" rx="10"/>
      <rect x="-152" y="-92" width="64" height="54" rx="10"/>
      <rect x="-78" y="-92" width="64" height="54" rx="10"/>
      <rect x="-4" y="-92" width="64" height="54" rx="10"/>
      <rect x="70" y="-92" width="64" height="54" rx="10"/>
      <rect x="144" y="-92" width="64" height="54" rx="10"/>
      <rect x="218" y="-92" width="64" height="54" rx="10"/>
      <rect x="-300" y="-28" width="80" height="54" rx="10"/>
      <rect x="-210" y="-28" width="64" height="54" rx="10"/>
      <rect x="-136" y="-28" width="64" height="54" rx="10"/>
      <rect x="-62" y="-28" width="64" height="54" rx="10"/>
      <rect x="12" y="-28" width="64" height="54" rx="10"/>
      <rect x="86" y="-28" width="64" height="54" rx="10"/>
      <rect x="160" y="-28" width="122" height="54" rx="10"/>
    </g>
    <rect x="-300" y="36" width="240" height="46" rx="9" fill="url(#accent)" opacity=".92"/>
    <rect x="-50" y="36" width="200" height="46" rx="9" fill="url(#key)"/>
    <rect x="160" y="36" width="122" height="46" rx="9" fill="url(#key)"/>
  </g>

  <!-- средний слой: рамка -->
  <g transform="translate(600 372) rotate(-8) skewX(-14)" stroke="#0b0f14" stroke-width="2">
    <rect x="-350" y="-130" width="700" height="260" rx="30" fill="url(#plate)" opacity=".85"/>
    <rect x="-350" y="-130" width="700" height="260" rx="30" fill="none" stroke="#7fe0ff" stroke-opacity=".35"/>
  </g>

  <!-- нижний слой: основание -->
  <g transform="translate(600 452) rotate(-8) skewX(-14)">
    <rect x="-370" y="-140" width="740" height="280" rx="34" fill="#0f141c" stroke="#d7ff4f" stroke-opacity=".25" stroke-width="2"/>
    <rect x="-330" y="-100" width="660" height="200" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="8 10"/>
  </g>

  <!-- технические подписи -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#8f9aac" letter-spacing="3">
    <text x="70" y="92">APEX ONE / EXPLODED VIEW</text>
    <text x="1000" y="700" fill="#d7ff4f">01 — 03</text>
    <text x="70" y="700">SCROLL TO DISASSEMBLE</text>
  </g>
  <circle cx="1060" cy="86" r="7" fill="#d7ff4f"/>
</svg>
